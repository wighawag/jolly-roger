		<!-- inject eruda loader (use ?eruda or even ?eruda=<plugin package name separated by ",">).
		     Custom plugin loading is gated by the eruda-plugins meta above and is
		     enabled only in a debug build (see scripts/enable-eruda-plugins.mjs).
		     Core eruda loading and the active-eruda/localStorage gate are unchanged. -->
		<!--prettier-ignore -->
		<script>
		(function () {
			let params = new URLSearchParams(window.location.search);
			const eruda_options = params.get('eruda');
			if (eruda_options !== "" && !eruda_options && localStorage.getItem('active-eruda') != 'true') return;
			const erudaPluginsEnabled = document.querySelector('meta[name="eruda-plugins"]')?.content === 'true';
			const _ = '';
			let add_plugins = '';
			let load_plugins = '';
			if (eruda_options.length > 0 && erudaPluginsEnabled) {
				for (const plugin of eruda_options.split(",")) {
					let [pkg, v] = plugin.split(":");
					v = v || pkg.split('-').map((split, i) => i > 0 ? split[0].toUpperCase() + split.slice(1): split).join('');
					load_plugins += `document.write(\`<scr\${_}ipt src="//cdn.jsdelivr.net/npm/${pkg}"></scr\${_}ipt>\`);`;
					add_plugins += `eruda.add(${v});`;
				}
			}

			// you might want to load eruda from from %sveltekit.assets%//debug/eruda.js
			// document.write(`<scr${_}ipt src="%sveltekit.assets%/debug/eruda.js"></scr${_}ipt>`);
			// and fallback on cdn.jsdelivr.net
			document.write(`
				<scr${_}ipt>
					const _ = '';
					if (typeof eruda === "undefined") {
						document.write(\`<scr\${_}ipt src="//cdn.jsdelivr.net/npm/eruda"></scr\${_}ipt>\`);
					};
					${load_plugins}
					document.write(\`<scr\${_}ipt>eruda.init();${add_plugins}</scr\${_}ipt>\`);
				</scr${_}ipt>
			`);
		})();

		<!-- Pre-JS navigation bar. Rendered before any CSS/JS request resolves,
		     so it has to be inline. It covers the gap between first paint and
		     hydration. NavigationProgress.svelte removes it as soon as it mounts
		     and takes over all navigation feedback. That removal is the only
		     contract between this file and the app. -->
		<style>
			:root {
				/* One accent for every loading indicator (slate-400 by default -
				   override to match your brand). Space separated RGB so it
				   composes with alpha: rgb(var(--nav-accent) / 0.12) */
				--nav-accent: 148 163 184;
				--nav-bar-height: 2px;
			}
			#app-loader {
				position: fixed;
				inset: 0 0 auto 0;
				height: var(--nav-bar-height);
				z-index: 9999;
				pointer-events: none;
				background: rgb(var(--nav-accent) / 0.12);
			}
			/* Hidden until the reveal script below decides the load is slow
			   enough to be worth showing, so fast loads never flash it. */
			#app-loader[hidden] {
				display: none;
			}

				content: '';
				display: block;
				height: 100%;
				width: 40%;
				background: rgb(var(--nav-accent));
				box-shadow: 0 0 8px rgb(var(--nav-accent) / 0.55);
				animation: app-loader-shuttle 1.1s ease-in-out infinite;

				opacity: 0;

			// wins the race, NavigationProgress removes the element first and
			// this becomes a no-op.

				var el = document.getElementById('app-loader');
				if (el) el.removeAttribute('hidden');
			}, 150);
		</script>
