packages:
  - "web"
  - "contracts"
onlyBuiltDependencies:
  - esbuild
# These published versions import `eip-1193` types from their .d.ts files but
# only list it as a devDependency, so their types resolve against whichever
# eip-1193 pnpm happens to hoist. As soon as anything brings a second version
# in (webevm 0.9, via @eip-1193/over-port, brings 0.7), the hoisted copy flips
# and the app no longer type-checks. Declaring the dependency they forgot pins
# them to the version the app uses. Remove an entry once a release of that
# package declares eip-1193 itself, and move all three with the app when it
# migrates to eip-1193 0.7.
packageExtensions:
  "@etherkit/tx-observer@<=0.2.0":
    dependencies:
      eip-1193: ^0.6.5
  "@etherplay/wallet-connector-ethereum@<=0.1.1":
    dependencies:
      eip-1193: ^0.6.5
  "eip-1193-accounts-wrapper@<=0.2.0":
    dependencies:
      eip-1193: ^0.6.5
