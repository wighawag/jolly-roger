name: Publish create-jolly-roger

# When changes are merged to main, publish a new version of the
# create-jolly-roger npm package with the updated template bundled in.
#
# Required secrets (configure in jolly-roger repo settings → Secrets):
#   PAT        – a personal access token with write access to wighawag/create-jolly-roger
#   NPM_TOKEN  – an npm access token with publish rights for create-jolly-roger

on:
  push:
    branches: [main]

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    name: Update template & publish

    steps:
      - name: Checkout jolly-roger
        uses: actions/checkout@v5
        with:
          path: jolly-roger

      - name: Prepare template
        run: |
          # Copy jolly-roger into a clean template directory, excluding
          # generated / runtime / environment-specific files that should
          # not be part of the scaffolded project.
          rsync -a \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.svelte-kit' \
            --exclude='artifacts' \
            --exclude='cache' \
            --exclude='generated' \
            --exclude='dist' \
            --exclude='deployments' \
            --exclude='purgatory.db' \
            --exclude='.env.local' \
            --exclude='.env.*.local' \
            --exclude='.nightshift-plan' \
            --exclude='.kilo' \
            --exclude='.vscode' \
            --exclude='tmp' \
            --exclude='yalc.lock' \
            --exclude='.yalc' \
            --exclude='test-results' \
            --exclude='playwright-report' \
            --exclude='static/pwa' \
            --exclude='coverage' \
            --exclude='_metadata' \
            --exclude='pnpm-lock.yaml' \
            --exclude='.github/workflows/publish-create-jolly-roger.yml' \
            jolly-roger/ /tmp/template/

      - name: Checkout create-jolly-roger
        uses: actions/checkout@v5
        with:
          repository: wighawag/create-jolly-roger
          token: ${{ secrets.PAT }}
          path: create-jolly-roger

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Update template and check for changes
        id: changes
        run: |
          cd create-jolly-roger
          rm -rf template
          cp -a /tmp/template template
          if git diff --exit-code --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No template changes detected, skipping publish."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Bump version, commit, push, and publish
        if: steps.changes.outputs.changed == 'true'
        run: |
          cd create-jolly-roger
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Bump patch version (updates package.json, no git tag yet)
          npm version patch --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")

          # Commit template update + version bump
          git add -A
          git commit -m "chore: update template from jolly-roger@${{ github.sha }}

          Auto-published from jolly-roger main branch."
          git tag "v$NEW_VERSION"
          git push
          git push --tags

          # Publish to npm
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}